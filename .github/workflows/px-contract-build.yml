name: PxLabs Deterministic Contract Compiler

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/antelopeio/cdt:4.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: |
          mkdir -p build
          shopt -s nullglob
          sources=(contracts/src/*.cpp)
          if [ ${#sources[@]} -eq 0 ]; then
            echo "No contracts/src/*.cpp — tooling-only quest."
            exit 0
          fi
          cdt-cpp -I ./contracts/include -I ./include \
            -O3 -Wall -Wextra -Werror --abigen \
            "${sources[@]}" \
            -o ./build/contract.wasm

      - name: SHA-256 manifest
        run: |
          if [ -d build ]; then
            cd build
            sha256sum *.wasm *.abi > SHA256SUMS.txt || true
            cat SHA256SUMS.txt || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contract-artifacts
          path: |
            build/*.wasm
            build/*.abi
            build/SHA256SUMS.txt
          if-no-files-found: warn
